<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Interactive rating component</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Rating state start -->
    <div class="avaliation">
      <img class="star" src="./images/icon-star.svg" alt="icon star" />
      <h1 class="title-avaliation">How did we do?</h1>
      <p class="text-avaliation">
        Please let us know how we did with your support request. All feedback is
        appreciated to help us improve our offering!
      </p>
      <div class="rating">
        <ul>
          <li><button onclick="calcular(this)">1</button></li>
          <li><button onclick="calcular(this)">2</button></li>
          <li><button onclick="calcular(this)">3</button></li>
          <li><button onclick="calcular(this)">4</button></li>
          <li><button onclick="calcular(this)">5</button></li>
        </ul>
      </div>
      <button class="button-submit" onclick="submit()">Submit</button>
    </div>
    <!-- Rating state end -->

    <!-- Thank you state start -->
    <div class="tankyou hidden">
      <img
        class="image-tank"
        src="./images/illustration-thank-you.svg"
        alt="image tankyou"
      />
      <p class="selected-tank">
        You selected <span class="number-tank">number</span> out of 5
      </p>

      <h1 class="tanks">Thank you!</h1>
      <p class="text-tank">
        We appreciate you taking the time to give a rating. If you ever need
        more support, don’t hesitate to get in touch!
      </p>
    </div>
    <!-- Thank you state end -->
    <script src="script.js"></script>
  </body>
</html>
